name: esimde-archive

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esimde
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esimde"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/esimde?sslmode=disable
      JWT_SECRET: esimde-secret-super-key-2026
      DEV_AUTH_VISIBLE: "true"
      PUBLIC_APP_URL: http://127.0.0.1:5174
      WHATSAPP_PHONE: ""
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  pgdata:
